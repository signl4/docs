
remote_theme: "just-the-docs/just-the-docs"
# Find the documentation here: https://just-the-docs.com/docs/customization/
# With side bar and dark: "vaibhavvikas/jekyll-theme-minimalistic"
# Nice and light: "pages-themes/slate"
# Dark "flancast90/millidocs-dark"
plugins:
- jekyll-remote-theme
- jekyll-seo-tag
- jekyll-sitemap

